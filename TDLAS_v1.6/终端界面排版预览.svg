<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf1f7"/>
    </linearGradient>
    <linearGradient id="camera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263746"/>
      <stop offset="0.5" stop-color="#5d7883"/>
      <stop offset="1" stop-color="#14222d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#9da9b8" flood-opacity="0.3"/>
    </filter>
    <style>
      .title { font: 700 22px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #1f2937; }
      .label { font: 14px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #425466; }
      .small { font: 12px 'Microsoft YaHei', 'Segoe UI', sans-serif; fill: #718096; }
      .value { font: 14px 'Segoe UI', sans-serif; fill: #1f2937; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .button { fill: #ffffff; stroke: #aebdce; stroke-width: 1.2; }
      .button-active { fill: #e8f0ff; stroke: #4676c7; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1440" height="54" fill="#233142"/>
  <text x="28" y="35" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#ffffff">TDLAS 测氢 v1.6</text>
  <text x="1260" y="34" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">终端界面（内嵌切换）</text>

  <!-- left control panel -->
  <rect x="18" y="72" width="376" height="778" rx="8" class="group" filter="url(#shadow)"/>
  <text x="36" y="103" class="title">参数设置</text>
  <line x1="36" y1="116" x2="376" y2="116" stroke="#e2e8f0"/>
  <g class="label">
    <text x="36" y="145">采集卡</text><text x="36" y="181">输出通道</text><text x="36" y="217">输出波形</text>
    <text x="36" y="253">波形频率</text><text x="36" y="289">波形幅值</text><text x="36" y="325">波形偏移量</text>
    <text x="36" y="361">采集通道</text><text x="36" y="397">采样率</text><text x="36" y="433">显示窗口读取点数</text>
    <text x="36" y="469">量程下限</text><text x="36" y="505">量程上限</text>
  </g>
  <g>
    <rect x="150" y="127" width="207" height="26" rx="4" class="button"/><text x="162" y="145" class="value">Dev1 · PCIe-6363</text><rect x="311" y="132" width="40" height="18" rx="3" fill="#eef2f7"/><text x="318" y="145" class="small">刷新</text>
    <rect x="150" y="163" width="207" height="26" rx="4" class="button"/><text x="162" y="181" class="small">未配置输出通道</text>
    <rect x="150" y="199" width="207" height="26" rx="4" class="button"/><text x="162" y="217" class="value">正弦波</text><text x="337" y="217" class="small">⌄</text>
    <rect x="150" y="235" width="207" height="26" rx="4" class="button"/><text x="162" y="253" class="value">1000 Hz</text>
    <rect x="150" y="271" width="207" height="26" rx="4" class="button"/><text x="162" y="289" class="value">0.100 V</text>
    <rect x="150" y="307" width="207" height="26" rx="4" class="button"/><text x="162" y="325" class="value">0.000 V</text>
    <rect x="150" y="343" width="207" height="26" rx="4" class="button"/><text x="162" y="361" class="value">Dev1/ai0</text>
    <rect x="150" y="379" width="207" height="26" rx="4" class="button"/><text x="162" y="397" class="value">10000 S/s</text>
    <rect x="150" y="415" width="207" height="26" rx="4" class="button"/><text x="162" y="433" class="value">1000 点</text>
    <rect x="150" y="451" width="207" height="26" rx="4" class="button"/><text x="162" y="469" class="value">-10.00 V</text>
    <rect x="150" y="487" width="207" height="26" rx="4" class="button"/><text x="162" y="505" class="value">10.00 V</text>
  </g>

  <rect x="36" y="535" width="340" height="58" rx="6" class="group"/>
  <text x="50" y="558" class="label">采集控制</text>
  <rect x="50" y="568" width="92" height="18" rx="3" fill="#2d8a62"/><text x="65" y="581" font-family="Microsoft YaHei" font-size="11" fill="#fff">开始采集</text>
  <rect x="150" y="568" width="92" height="18" rx="3" fill="#eef2f7"/><text x="166" y="581" class="small">停止采集</text>
  <rect x="250" y="568" width="92" height="18" rx="3" fill="#eef2f7"/><text x="265" y="581" class="small">保存参数</text>

  <rect x="36" y="608" width="340" height="94" rx="6" class="group"/>
  <text x="50" y="632" class="label">数据监测</text>
  <text x="50" y="657" class="small">峰值吸光度</text><text x="190" y="657" class="value">0.0834</text>
  <text x="50" y="681" class="small">光强百分比</text><text x="190" y="681" class="value">96.2 %</text>

  <rect x="36" y="716" width="340" height="116" rx="6" class="group"/>
  <text x="50" y="740" class="label">fv1 曲线</text>
  <line x1="62" y1="807" x2="352" y2="807" stroke="#cbd5e1"/><line x1="62" y1="753" x2="62" y2="807" stroke="#cbd5e1"/>
  <polyline points="64,802 105,800 140,793 175,775 208,784 242,766 277,789 312,779 350,783" fill="none" stroke="#5267a8" stroke-width="2.5"/>
  <text x="207" y="826" class="small">v_f</text><text x="44" y="777" class="small" transform="rotate(-90 44 777)">fv1</text>

  <!-- right display -->
  <rect x="414" y="72" width="1008" height="778" rx="8" class="group" filter="url(#shadow)"/>
  <g transform="translate(438 90)">
    <rect x="0" y="0" width="148" height="34" rx="5" class="button"/><text x="29" y="22" class="label">波形与拟合</text>
    <rect x="158" y="0" width="116" height="34" rx="5" class="button"/><text x="183" y="22" class="label">峰值数据</text>
    <rect x="282" y="0" width="116" height="34" rx="5" class="button-active"/><text x="309" y="22" font-family="Microsoft YaHei" font-size="14" font-weight="700" fill="#315ea8">终端界面</text>
    <text x="690" y="22" class="small">右侧内容区内嵌切换，不打开独立窗口</text>

    <!-- camera image, intentionally dominant -->
    <rect x="0" y="52" width="960" height="476" rx="7" fill="#12202b" stroke="#9aabb8" stroke-width="1.2"/>
    <rect x="10" y="62" width="940" height="456" rx="4" fill="url(#camera)"/>
    <ellipse cx="476" cy="284" rx="260" ry="148" fill="#9db7bb" opacity="0.25"/>
    <ellipse cx="476" cy="284" rx="154" ry="94" fill="#d1dbd0" opacity="0.22"/>
    <circle cx="476" cy="284" r="56" fill="#bec8bf" opacity="0.24"/>
    <path d="M80 450 C230 340, 305 430, 430 356 S700 344, 880 438" fill="none" stroke="#c9d7d3" stroke-width="3" opacity="0.33"/>
    <path d="M80 160 C220 230, 310 145, 470 208 S720 205, 880 144" fill="none" stroke="#b9d1d0" stroke-width="2" opacity="0.22"/>
    <text x="28" y="94" font-family="Microsoft YaHei" font-size="13" fill="#dbe7e9">USB 摄像模组 · 实时预览</text>
    <text x="28" y="500" font-family="Segoe UI" font-size="12" fill="#dbe7e9">1920 × 1080   30 fps</text>

    <!-- peak chart below -->
    <rect x="0" y="542" width="960" height="186" rx="7" class="group"/>
    <text x="20" y="570" class="title" font-size="17">峰值数据记录</text>
    <text x="760" y="570" class="small">最近 20 个周期</text>
    <line x1="58" y1="700" x2="930" y2="700" stroke="#cbd5e1"/>
    <line x1="58" y1="590" x2="58" y2="700" stroke="#cbd5e1"/>
    <line x1="58" y1="645" x2="930" y2="645" stroke="#e7edf3"/>
    <polyline points="62,686 110,674 158,678 206,649 254,659 302,635 350,641 398,612 446,622 494,600 542,615 590,584 638,601 686,578 734,592 782,570 830,584 878,560 926,568" fill="none" stroke="#d1495b" stroke-width="3"/>
    <circle cx="926" cy="568" r="4.5" fill="#d1495b"/>
    <text x="458" y="720" class="small">周期序号</text><text x="41" y="631" class="small" transform="rotate(-90 41 631)">峰值吸光度</text>
  </g>
  <rect x="0" y="866" width="1440" height="34" fill="#e4eaf2"/>
  <circle cx="25" cy="883" r="6" fill="#2d8a62"/><text x="40" y="888" class="small">系统就绪 · 终端界面为主窗口内嵌页面</text>
</svg>
